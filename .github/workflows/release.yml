name: Release

# Triggered by a version bump landing on main -- not by a manually pushed
# tag. The tag and the GitHub Release are both created here, by this
# workflow's own token, so shipping a new version is just "bump <Version>
# in KubaToolKit.csproj and push to main"; nobody needs to push a tag by
# hand. Safe to run on any csproj change: if the tag for the current
# <Version> already exists (nothing to release -- e.g. an unrelated
# csproj edit), the build/publish/release steps are skipped.
on:
  push:
    branches: [main]
    paths:
      - "KubaToolKit.csproj"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content KubaToolKit.csproj
          $version = $csproj.Project.PropertyGroup.Version | Select-Object -First 1
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Skip if this version was already released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # pwsh 7.3+ (what GitHub Actions runs) turns a non-zero exit
          # from a native command like gh into a terminating error by
          # default -- redirecting stderr doesn't stop that, only try/
          # catch around it does, so "not found yet" has to be caught
          # here rather than read back off $LASTEXITCODE afterward.
          $tag = "v${{ steps.version.outputs.version }}"
          try {
            gh release view $tag 2>$null | Out-Null
            "skip=true" >> $env:GITHUB_OUTPUT
          } catch {
            "skip=false" >> $env:GITHUB_OUTPUT
          }

      - name: Setup .NET
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        if: steps.check.outputs.skip == 'false'
        run: dotnet publish KubaToolKit.csproj -c Release -o publish

      # Zipped from inside the publish folder, not the folder itself, so
      # the archive's root already matches the app's install directory
      # layout -- UpdateService can then extract it straight over the
      # existing install with no extra "which folder is the real one"
      # guessing (it copes with a wrapper folder anyway, but this avoids
      # needing to rely on that fallback at all).
      - name: Zip publish output
        if: steps.check.outputs.skip == 'false'
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath KubaToolKit.zip

      - name: Create tag and GitHub Release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          gh release create $tag KubaToolKit.zip --title $tag --generate-notes
